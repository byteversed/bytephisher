<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in to Snapchat</title>
<meta name="theme-color" content="#FFFC00">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23FFFC00%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23FFFC00%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3ES%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Sign in to Snapchat">
<meta property="og:site_name" content="Snapchat">
<style>
  body { margin:0;min-height:100vh;background:#0b0d12;color:#fff;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,
                     sans-serif;display:flex;align-items:center;justify-content:center;
         padding:32px 16px; }
  .card { background:#151922;width:100%;max-width:420px;border-radius:12px;
          padding:40px 36px;box-sizing:border-box;
          box-shadow:0 20px 60px rgba(0,0,0,.55);text-align:center; }
  .mark { display:flex;justify-content:center;margin:0 0 22px; }
  h1 { font-size:22px;font-weight:600;margin:0 0 8px; }
  .sub { font-size:14px;color:#9aa7b8;margin:0 0 26px; }
  .field { text-align:left;margin-bottom:14px; }
  .field label { display:block;font-size:13px;color:#9aa7b8;margin:0 0 6px; }
  .field input { width:100%;padding:13px 14px;font-size:15px;color:#fff;
                 background:#151922;border:1px solid #2a3242;border-radius:8px;
                 outline:none;box-sizing:border-box; }
  .field input:focus { border-color:#FFFC00; }
  .btn { width:100%;padding:13px;font-size:16px;font-weight:600;color:#fff;
         background:#FFFC00;border:0;border-radius:8px;cursor:pointer;margin-top:8px; }
  .row { display:flex;justify-content:space-between;align-items:center;margin:16px 0 0;
         font-size:13px;color:#9aa7b8; }
  .row a { color:#FFFC00;text-decoration:none; }
  .foot { font-size:12px;color:#7b8698;margin-top:22px;line-height:1.6; }
  .hp { position:absolute;left:-9999px;width:1px;height:1px;opacity:0; }
</style>
</head>
<body>
<div class="card">
  <div class="mark"><svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Snapchat"><path fill="#fffc00" d="M12 1.8c3.2 0 5.4 2.5 5.4 5.6 0 .8-.1 1.6-.2 2.2.5.2 1.1.4 1.5.4.6 0 1 .4 1 1s-.5.9-1.2 1.1c-.5.2-1.3.4-1.5.8-.1.4.4 1.4 1.2 2.3.9 1 2 1.7 2.5 1.7.3 0 .5.2.5.5 0 .6-1.2 1-2.3 1.2-.4.1-.6.4-.7.9-.1.5-.3.9-.7.9-.5 0-1-.3-1.7-.3-.9 0-1.6.7-2.6 1.3-.6.4-1.2.6-1.9.6s-1.3-.2-1.9-.6c-1-.6-1.7-1.3-2.6-1.3-.7 0-1.2.3-1.7.3-.4 0-.6-.4-.7-.9-.1-.5-.3-.8-.7-.9-1.1-.2-2.3-.6-2.3-1.2 0-.3.2-.5.5-.5.5 0 1.6-.7 2.5-1.7.8-.9 1.3-1.9 1.2-2.3-.2-.4-1-.6-1.5-.8-.7-.2-1.2-.5-1.2-1.1s.4-1 1-1c.4 0 1-.2 1.5-.4-.1-.6-.2-1.4-.2-2.2 0-3.1 2.2-5.6 5.4-5.6z"/></svg></div>
  <h1>Snapchat</h1>
  <p class="sub">Sign in with your username</p>
  <form method="POST" action="/">
    <div class="field">
      <label for="username">Username or email</label>
      <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Sign in</button>
    <div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="remember" value="1" checked> Keep me signed in</label><a href="#">Forgot password?</a></div>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="snapchat">
  <input type="hidden" name="_ts" value="__TS__">

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
    <div class="foot">Snapchat and the Snapchat mark are trademarks of their respective owner.</div>
  </form>
</div>
</body>
</html>
